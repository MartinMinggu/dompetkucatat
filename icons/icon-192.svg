<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <g transform="translate(96,96)">
    <!-- Wallet body -->
    <rect x="-50" y="-35" width="100" height="70" rx="12" fill="url(#accent)" opacity="0.9"/>
    <!-- Wallet flap -->
    <path d="M-50,-35 L-50,-20 Q-50,-35 -38,-35 L30,-35 Q50,-35 50,-15 L50,-35 Q50,-35 38,-35 Z" fill="url(#accent)"/>
    <!-- Coin slot -->
    <circle cx="30" cy="0" r="12" fill="#0f172a" opacity="0.3"/>
    <circle cx="30" cy="0" r="8" fill="#fbbf24"/>
    <text x="30" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">$</text>
    <!-- Card lines -->
    <rect x="-38" y="-10" width="40" height="4" rx="2" fill="white" opacity="0.3"/>
    <rect x="-38" y="2" width="28" height="4" rx="2" fill="white" opacity="0.2"/>
    <rect x="-38" y="14" width="20" height="4" rx="2" fill="white" opacity="0.15"/>
  </g>
</svg>
