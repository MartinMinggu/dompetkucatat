<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Wallet body -->
    <rect x="-130" y="-90" width="260" height="180" rx="30" fill="url(#accent)" opacity="0.9"/>
    <!-- Wallet flap -->
    <path d="M-130,-90 L-130,-50 Q-130,-90 -100,-90 L80,-90 Q130,-90 130,-40 L130,-90 Q130,-90 100,-90 Z" fill="url(#accent)"/>
    <!-- Coin slot -->
    <circle cx="80" cy="0" r="32" fill="#0f172a" opacity="0.3"/>
    <circle cx="80" cy="0" r="22" fill="#fbbf24"/>
    <text x="80" y="8" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">$</text>
    <!-- Card lines -->
    <rect x="-100" y="-25" width="105" height="10" rx="5" fill="white" opacity="0.3"/>
    <rect x="-100" y="5" width="75" height="10" rx="5" fill="white" opacity="0.2"/>
    <rect x="-100" y="35" width="55" height="10" rx="5" fill="white" opacity="0.15"/>
  </g>
</svg>
